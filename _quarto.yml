project:
  type: website
  # Only site pages are rendered; supporting code, notebooks, and coursework stay as browsable files on GitHub
  render:
    - "*.qmd"
    - "*.Rmd"
    - "!*/coursework/"
    - "!Full_Stack/airflow-etl-pipelines/"
    - "!Full_Stack/portlight-system-monitor/"
    - "!Machine_Learning/notebooks/"
    - "!docs/"
  resources:
    - "Images/*"

# Results are computed locally and committed in _freeze/, so the GitHub build doesn't re-run analyses
execute:
  freeze: auto
  warning: false
  message: false

website:
  title: "Spencer Payne"
  image: Images/social-card.png
  description: "Spencer Payne, data science student at BYU–Idaho. Portfolio of statistics, data wrangling, visualization, machine learning, and data engineering (Airflow, Snowflake) projects."
  site-url: https://crampsp.github.io
  open-graph: true
  twitter-card: true
  repo-url: https://github.com/CrampsP/CrampsP.github.io
  favicon: Images/favicon.png
  back-to-top-navigation: true
  page-navigation: true

  navbar:
    background: primary
    search: true
    left:
      - text: "Statistical Analysis"
        href: statistics.qmd
      - text: "Data Cleansing"
        href: cleansing.qmd
      - text: "Data Exploration"
        href: exploration.qmd
      - text: "Story Telling"
        href: story_telling.qmd
      - text: "Machine Learning"
        href: ml.qmd
      - text: "Full Stack"
        href: full_stack.qmd
      - text: "Competition"
        href: competition.qmd
    right:
      - text: "Resume"
        href: resume.qmd
      - icon: github
        href: https://github.com/CrampsP
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/spencer-payne-95090428b
        aria-label: LinkedIn

  page-footer:
    border: true
    left: "© 2026 Spencer Payne"
    right:
      - icon: github
        href: https://github.com/CrampsP
      - icon: linkedin
        href: https://www.linkedin.com/in/spencer-payne-95090428b
      - icon: envelope
        href: mailto:spayne22802@gmail.com

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    code-fold: true
    code-summary: "Show the code"
    code-overflow: wrap
    code-copy: hover
    fig-align: center
    html-math-method: katex
    title-block-banner: true
